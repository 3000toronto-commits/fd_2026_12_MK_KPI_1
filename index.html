<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Упражнение 1. Какие расходы взять под контроль первыми</title>
  <style>
    :root {
      --kpi-sand: #D9C8A7;
      --kpi-terracotta: #C77C67;
      --kpi-blue: #6F86A3;
      --kpi-sage: #A9B7A3;
      --kpi-milk: #F7F6F1;
      --kpi-ink: #2A2F33;
      --kpi-white: #FFFFFF;
    }
    .kpi-course-root, .kpi-course-root * { box-sizing: border-box; }
    .kpi-course-root { width:100%; min-height:100vh; padding: 30px 18px 60px; background: var(--kpi-milk); color:var(--kpi-ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; font-size:16px; line-height:1.5; }
    .kpi-course-shell {max-width: 960px; margin:0 auto;}
    .kpi-course-top {display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:18px; }
    .kpi-course-brand {display:flex; align-items:center; gap:10px; font-weight:700; font-size:13px; color:#546a82; letter-spacing:.025em; }
    .kpi-course-brandmark {width:34px; height:34px; display:grid; place-items:center; background:var(--kpi-sand); border-radius:10px; color:var(--kpi-ink); font-size:16px;}
    .kpi-course-step-label {font-size:13px; color:#616b70; font-weight:650;}
    .kpi-course-progress {height:7px; border-radius:99px; background:#e8e5de; overflow:hidden; margin-bottom:23px;}
    .kpi-course-progress-fill {height:100%; background:var(--kpi-blue); border-radius:99px; transition:width .23s ease;}
    .kpi-course-panel {background:var(--kpi-white); border:1px solid #e7e1d8; box-shadow: 0 8px 34px rgba(42,47,51,.035); border-radius:22px; padding:clamp(22px,4vw,42px);}
    .kpi-course-eyebrow {font-weight:750; text-transform:uppercase; font-size:11px; letter-spacing:.13em; color:#647c94; margin:0 0 9px;}
    .kpi-course-title {font-size:clamp(24px,3.7vw,34px); font-weight:780; letter-spacing:-.035em; line-height:1.19; margin:0 0 13px; max-width:760px;}
    .kpi-course-description {color:#515a60; max-width:760px; margin:0 0 26px; font-size:15.5px;}
    .kpi-course-muted {font-size:13px; color:#697279;}
    .kpi-course-small {font-size:13.5px;}
    .kpi-course-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;}
    .kpi-course-industry {background:#fff;border:1.5px solid #e4e1db;border-radius:16px;padding:23px 15px;cursor:pointer;text-align:left;min-height:152px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:18px;color:var(--kpi-ink);font:inherit;transition:border-color .15s,background .15s,transform .15s;}
    .kpi-course-industry:hover {border-color:#9caebd;transform:translateY(-1px);}
    .kpi-course-industry[aria-pressed="true"] {border:2px solid var(--kpi-blue);background:#f4f0e6;padding:22.5px 14.5px;}
    .kpi-course-industry-name {font-size:16px;font-weight:760;line-height:1.3;}
    .kpi-course-industry svg {width:34px;height:34px;stroke:#657f9c;}
    .kpi-course-info {background:#f5f2eb;border:1px solid #e8dfcf;border-radius:14px;padding:16px 18px;color:#4f5558;}
    .kpi-course-info strong {color:var(--kpi-ink);}
    .kpi-course-note {display:flex;align-items:flex-start;gap:10px; margin-top:22px; padding:13px 15px;background:#f6f4ef;border-radius:12px;font-size:13px;color:#626970;}
    .kpi-course-note svg {flex:none;width:18px;height:18px;}
    .kpi-course-metrics {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:22px 0;}
    .kpi-course-metric {border-radius:15px;padding:17px;background:#f7f5ef;border:1px solid #efe9db;}
    .kpi-course-metric:nth-child(2) {background:#f0f3ef;border-color:#e3e9df;}
    .kpi-course-metric:nth-child(3) {background:#f8efeb;border-color:#f1e2db;}
    .kpi-course-metric-label {font-size:12px;color:#5f676c;font-weight:630;min-height:35px;}
    .kpi-course-metric-value {font-size:clamp(23px,3.2vw,31px);font-weight:790;line-height:1.2;letter-spacing:-.04em;margin-top:6px;}
    .kpi-course-table-wrap {overflow-x:auto;border:1px solid #eae7e1;border-radius:14px;margin-top:18px;}
    .kpi-course-table {width:100%;border-collapse:collapse;font-size:14px;}
    .kpi-course-table th {text-align:left;background:#f4f1e9;color:#515a5e;font-weight:720;padding:13px 14px;white-space:nowrap;}
    .kpi-course-table td {padding:13px 14px;border-top:1px solid #ece9e3;}
    .kpi-course-table td:not(:first-child),.kpi-course-table th:not(:first-child) {text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
    .kpi-course-table tfoot td {font-weight:750;background:#faf8f3;}
    .kpi-course-data-table {margin-top:14px;overflow:visible;}
    .kpi-course-data-table .kpi-course-table td {vertical-align:middle;}
    .kpi-course-data-table .kpi-course-table td.kpi-course-detail-cell {padding:0;text-align:left;white-space:normal;}
    .kpi-course-table tr.kpi-course-expand-row > td {background:#fcfaf6;border-top:0;}
    .kpi-course-table tr.kpi-course-article-row[aria-selected="true"] td {background:#f3f1e9;}
    .kpi-course-table tr.kpi-course-article-row:hover td {background:#f8f7f3;}
    .kpi-course-row-button {border:0;padding:5px 0;background:transparent;color:var(--kpi-ink);font:inherit;font-weight:720;text-align:left;cursor:pointer;display:flex;align-items:center;gap:8px;width:100%;}
    .kpi-course-row-button svg {flex:none;transition:transform .15s ease;color:var(--kpi-blue);}
    .kpi-course-row-button[aria-expanded="true"] svg {transform:rotate(180deg);}
    .kpi-course-row-button:focus-visible,.kpi-course-help:focus-visible {outline:3px solid var(--kpi-blue);outline-offset:3px;border-radius:6px;}
    .kpi-course-row-status {font-size:11px;font-weight:600;color:#536a57;margin-left:6px;white-space:nowrap;}
    .kpi-course-expanded {padding:19px 22px 19px;background:#fcfaf6;border-top:1px solid #e8e3d9;}
    .kpi-course-expanded .kpi-course-info {margin-bottom:17px;}
    .kpi-course-assessment-fields {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;}
    .kpi-course-assessment-fields .kpi-course-assessment-field {margin:0;min-width:0;}
    .kpi-course-assessment-fields .kpi-course-options {display:flex;flex-direction:column;align-items:stretch;}
    .kpi-course-assessment-fields .kpi-course-option span {padding:9px 10px;}
    .kpi-course-expanded-actions {display:flex;justify-content:flex-end;margin-top:18px;}
    .kpi-course-field-heading {display:flex;align-items:center;gap:6px;margin:0 0 6px;}
    .kpi-course-field-heading .kpi-course-field-label {margin:0;}
    .kpi-course-help-wrap {position:relative;display:inline-flex;align-items:center;}
    .kpi-course-help {border:1px solid #8496a5;background:#fff;color:#516f8d;width:19px;height:19px;border-radius:50%;padding:0;display:grid;place-items:center;font:700 12px/1 system-ui;cursor:help;}
    .kpi-course-help-tooltip {display:none;position:absolute;left:-20px;bottom:calc(100% + 11px);width:260px;max-width:calc(100vw - 65px);padding:12px 13px;background:#2a2f33;color:#fff;font-size:12px;line-height:1.5;font-weight:400;border-radius:10px;box-shadow:0 8px 22px #0002;z-index:10;pointer-events:none;}
    .kpi-course-help-wrap:hover .kpi-course-help-tooltip,.kpi-course-help-wrap:focus-within .kpi-course-help-tooltip,.kpi-course-help-wrap[data-open="true"] .kpi-course-help-tooltip {display:block;}
    .kpi-course-table-guide {font-size:13px;color:#656e71;margin-top:14px;}
    .kpi-course-table-guide strong {color:var(--kpi-ink);}
    @media(max-width:740px) {.kpi-course-assessment-fields {grid-template-columns:1fr;gap:20px;} .kpi-course-assessment-fields .kpi-course-options {flex-direction:row;flex-wrap:wrap;} .kpi-course-expanded {padding:15px 12px;} }
    @media(max-width:520px) {.kpi-course-data-table .kpi-course-table {font-size:11px;} .kpi-course-data-table .kpi-course-table th,.kpi-course-data-table .kpi-course-table td {padding:10px 6px;} .kpi-course-data-table .kpi-course-table th {white-space:normal;line-height:1.3;} .kpi-course-row-button {font-size:12px;gap:3px;} .kpi-course-row-button svg {width:13px;height:13px;} .kpi-course-row-status {font-size:10px;} .kpi-course-metrics {margin:13px 0;} }
    .kpi-course-pills {display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
    .kpi-course-pill {font-size:12px;padding:5px 9px;background:#eef0ef;border-radius:999px;color:#4f5b63;font-weight:650;}
    .kpi-course-pill--blue {background:#e8eef4;color:#506b89;}
    .kpi-course-pill--sage {background:#eaf1e6;color:#4b6c54;}
    .kpi-course-pill--clay {background:#f8ebe5;color:#9c5846;}
    .kpi-course-assessment {margin:0 0 12px;border:1.5px solid #e6e1d9;border-radius:15px;overflow:hidden;background:#fff;}
    .kpi-course-assessment--done {border-color:#bac8b5;}
    .kpi-course-assessment--open {border-color:#9dacc0;}
    .kpi-course-assessment-head {width:100%;display:flex;justify-content:space-between;gap:16px;align-items:center;cursor:pointer;background:#fff;padding:17px 18px;border:0;font:inherit;text-align:left;color:inherit;}
    .kpi-course-assessment-title {font-weight:740;font-size:15px;}
    .kpi-course-assessment-summary {font-size:12px;color:#687278;margin-top:3px;}
    .kpi-course-assessment-body {border-top:1px solid #ebe8e1;background:#fcfbf8;padding:19px;}
    .kpi-course-assessment-field {margin-bottom:23px;}
    .kpi-course-assessment-field:last-of-type {margin-bottom:12px;}
    .kpi-course-field-label {font-weight:740;font-size:14px;margin:0 0 5px;}
    .kpi-course-hint {font-size:12px;color:#70777b;margin:0 0 11px;}
    .kpi-course-options {display:flex;flex-wrap:wrap;gap:8px;}
    .kpi-course-option {position:relative;cursor:pointer;}
    .kpi-course-option input {position:absolute;opacity:0;width:1px;height:1px;}
    .kpi-course-option span {display:block;border:1.5px solid #dcdedc;border-radius:10px;background:#fff;padding:10px 13px;color:#424b50;font-size:13px;line-height:1.3;transition:background .12s,border-color .12s;}
    .kpi-course-option input:checked+span {border-color:var(--kpi-blue);background:#eaf0f5;color:#364c63;font-weight:740;}
    .kpi-course-option input:focus-visible+span,.kpi-course-root button:focus-visible {outline:3px solid #a5bfd8;outline-offset:3px;}
    .kpi-course-field-result {border-left:3px solid var(--kpi-terracotta);background:#fcf3ef;border-radius:0 10px 10px 0;padding:10px 12px;margin-top:10px;font-size:12.5px;line-height:1.5;}
    .kpi-course-field-result--right {border-left-color:#87a183;background:#f0f6ee;}
    .kpi-course-select-card {display:block;width:100%;border:1.5px solid #e4e0d9;background:#fff;border-radius:15px;padding:18px;cursor:pointer;color:var(--kpi-ink);text-align:left;font:inherit;min-height:149px;}
    .kpi-course-select-card[aria-pressed="true"] {border:2px solid var(--kpi-blue);background:#f6f1e6;padding:17.5px;}
    .kpi-course-select-card[aria-disabled="true"] {opacity:.65;cursor:not-allowed;}
    .kpi-course-select-title {font-size:15px;font-weight:770;line-height:1.3;}
    .kpi-course-select-subtitle {font-size:12.5px;color:#676e72;margin:7px 0 13px;}
    .kpi-course-choice-grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px;}
    .kpi-course-criteria {display:flex;gap:6px;flex-wrap:wrap;}
    .kpi-course-criteria span {font-size:11px;background:#f0f1ef;border-radius:6px;padding:5px 7px;color:#586166;}
    .kpi-course-counter {font-weight:740;color:#526c86;font-size:13px;margin-top:5px;}
    .kpi-course-feedback {padding:18px;border:1px solid #e0e5dd;border-radius:14px;background:#f3f7f1;margin-top:18px;}
    .kpi-course-feedback--warn {background:#fbf2ed;border-color:#efd8cd;}
    .kpi-course-feedback h3 {font-size:16px;margin:0 0 9px;}
    .kpi-course-feedback p {font-size:13.5px;margin:0 0 10px;color:#424b4f;}
    .kpi-course-feedback p:last-child {margin-bottom:0;}
    .kpi-course-divider {height:1px;background:#eae6e0;margin:26px 0;}
    .kpi-course-result-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px;}
    .kpi-course-result {border:1px solid #e1e5dc;background:#f8faf7;border-radius:14px;padding:17px;}
    .kpi-course-result-index {font-size:12px;color:#6d7d6d;font-weight:740;margin-bottom:8px;}
    .kpi-course-result h3 {font-size:15px;margin:0 0 9px;line-height:1.3;}
    .kpi-course-result p {font-size:12.5px;color:#525b59;margin:10px 0 0;}
    .kpi-course-footer {margin-top:28px;padding-top:21px;border-top:1px solid #ece8e1;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;}
    .kpi-course-actions {display:flex;gap:10px;flex-wrap:wrap;}
    .kpi-course-btn {appearance:none;border:1px solid transparent;border-radius:11px;padding:12px 19px;min-height:45px;font:inherit;font-size:14px;font-weight:730;cursor:pointer;transition:filter .14s,background .14s;white-space:normal;}
    .kpi-course-btn:hover:not(:disabled) {filter:brightness(.965);}
    .kpi-course-btn--primary {background:var(--kpi-terracotta);color:#fff;}
    .kpi-course-btn--secondary {background:#f0f1ee;color:#424d52;border-color:#e5e6e1;}
    .kpi-course-btn--ghost {background:transparent;color:#5f7590;border-color:#dbe2e8;}
    .kpi-course-btn:disabled {opacity:.44;cursor:not-allowed;}
    .kpi-course-inline-error {font-size:12.5px;color:#a65b47;margin:10px 0;}
    .kpi-course-confirm-backdrop {position:fixed;inset:0;background:rgba(24,30,36,.43);display:grid;place-items:center;z-index:10000;padding:20px;}
    .kpi-course-confirm-box {width:min(100%,420px);background:#fff;padding:25px;border-radius:17px;box-shadow:0 20px 70px rgba(0,0,0,.15);}
    .kpi-course-confirm-box h2 {margin:0 0 10px;font-size:20px;}
    .kpi-course-confirm-box p {font-size:14px;color:#576167;}
    .kpi-course-confirm-actions {display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap;margin-top:20px;}
    .kpi-course-badge-num {width:28px;height:28px;border-radius:50%;background:#eff0ea;display:grid;place-items:center;font-size:12px;font-weight:750;color:#586672;flex:none;}
    .kpi-course-alert {padding:15px;border-radius:12px;background:#edf3ea;border:1px solid #d9e6d6;margin-top:16px;font-size:13.5px;}
    .kpi-course-lastline {font-weight:680;color:#3c4c4f;font-size:15px;}
    @media(max-width:680px) {
      .kpi-course-root {padding:15px 10px 36px;}
      .kpi-course-panel {border-radius:17px;padding:20px 16px;}
      .kpi-course-grid,.kpi-course-result-grid {grid-template-columns:1fr;}
      .kpi-course-choice-grid {grid-template-columns:1fr;}
      .kpi-course-industry {min-height:94px;flex-direction:row;align-items:center;justify-content:flex-start;gap:17px;padding:17px;}
      .kpi-course-industry[aria-pressed="true"] {padding:16.5px;}
      .kpi-course-metrics {gap:6px;}
      .kpi-course-metric {padding:11px 9px;border-radius:11px;}
      .kpi-course-metric-label {font-size:10.5px;min-height:45px;}
      .kpi-course-metric-value {font-size:22px;}
      .kpi-course-assessment-body {padding:16px 13px;}
      .kpi-course-footer {align-items:stretch;}
      .kpi-course-actions {width:100%;}
      .kpi-course-actions .kpi-course-btn {flex:1;}
      .kpi-course-table {font-size:12px;}
      .kpi-course-table th,.kpi-course-table td {padding:10px 9px;}
    }
    @media(prefers-reduced-motion:reduce) { .kpi-course-root * {transition:none!important;animation:none!important;} }
  </style>
</head>
<body style="margin:0">

</main>

      if(ev.target===backdrop||ev.target.closest('[data-confirm="cancel"]')) return cancel();
      if(ev.target.closest('[data-confirm="yes"]')) {
        backdrop.remove();state.step=1;state.industry=null;state.assessments={};state.checked=false;state.openId=null;state.selected=[];state.reviewed=false;state.complete=false;render();
      }
    });
    backdrop.addEventListener('keydown',ev=>{if(ev.key==='Escape'){ev.preventDefault();cancel();}});
  }
  el.addEventListener('change',ev=>{
    const input=ev.target;
    if(!input.matches('input[type="radio"][data-field]')) return;
    if(!state.assessments[input.dataset.id])state.assessments[input.dataset.id]={};
    state.assessments[input.dataset.id][input.dataset.field]=input.value;
    if(state.checked) {state.checked=false;return render();}
    // Keep the current radio selection and the open assessment visible without a full re-render.
    const save=el.querySelector('[data-action="save-assess"]');
    if(save&&isAssessmentComplete(input.dataset.id))save.disabled=false;
  });
  el.addEventListener('click',ev=>{
    const button=ev.target.closest('button[data-action]');if(!button||button.disabled)return;
    const action=button.dataset.action,id=button.dataset.id;
    if(action==='industry')return changeIndustry(id);
    if(action==='tooltip') {const wrap=button.closest('.kpi-course-help-wrap');const opened=wrap.dataset.open==='true';el.querySelectorAll('.kpi-course-help-wrap[data-open]').forEach(w=>{w.dataset.open='false';w.querySelector('.kpi-course-help').setAttribute('aria-expanded','false');});wrap.dataset.open=String(!opened);button.setAttribute('aria-expanded',String(!opened));return;}
    if(action==='toggle-assess') {state.openId=state.openId===id?null:id;return render();}
    if(action==='save-assess') {
      if(!isAssessmentComplete(state.openId))return;
      const i=s().items.findIndex(x=>x.id===state.openId);
      state.openId=s().items.slice(i+1).find(x=>!isAssessmentComplete(x.id))?.id || s().items.find(x=>!isAssessmentComplete(x.id))?.id || null;
      return render();
    }
    if(action==='check-assess') {state.checked=true; state.openId=null;return render();}
    if(action==='select-item') {
      const i=state.selected.indexOf(id);
      if(i>=0)state.selected.splice(i,1);
      else if(state.selected.length<3)state.selected.push(id);
      return render();
    }
    if(action==='back'){state.step=Math.max(1,state.step-1);return render();}
    if(action==='next'){
      if(state.step===1&&!state.industry)return;
      if(state.step===2&&!state.checked)return;
      if(state.step===3&&state.selected.length!==3)return;
      state.step=Math.min(4,state.step+1);return render();
    }
    if(action==='edit'){state.step=3;state.complete=false;return render();}
    if(action==='restart')return confirmReset(true);
    
  });
  render();
})();
</script>
</body>
</html>
